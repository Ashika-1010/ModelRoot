[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "modelroot"
version = "0.0.1"
description = "Reproducible diagnosis engine for underperforming binary classifiers."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
    "pytest-cov==6.1.0",
    "hypothesis==6.131.15",
    "ruff==0.11.7",
    "mypy==1.15.0",
]

[tool.setuptools.packages.find]
where = ["src"]

# pytest configuration is in the root pytest.ini (applies when run from repo root).
# When running pytest from within core/ directly, pass --rootdir=.. to pick it up,
# or rely on the root pytest.ini being discovered automatically.

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "PIE", "SIM", "RUF"]
ignore = []

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/modelroot"]
