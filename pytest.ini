[pytest]
# Root pytest configuration — applies when pytest is run from the repository root.
# Tests live under core/tests/; the package is installed via pip install -e "core[dev]".
testpaths = core/tests
addopts = --strict-markers -q

markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    bench: marks tests as benchmark tests
    security: marks tests as security tests
    docker: marks tests requiring Docker
    e2e: marks tests as end-to-end tests
