[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "modelroot-bench"
version = "0.0.1"
description = "Failure injection benchmark for ModelRoot."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "modelroot",
    "pydantic>=2.0,<3.0",
    "pandas>=2.0,<3.0",
    "numpy>=1.26,<3.0",
    "scikit-learn>=1.4,<2.0",
    "scipy>=1.11,<2.0",
]

[project.scripts]
modelroot-bench = "modelroot_bench.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["modelroot_bench*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "PIE", "SIM", "RUF"]
ignore = []

[tool.mypy]
python_version = "3.12"
strict = true
files = ["modelroot_bench"]
exclude = [".venv", "venv"]

[[tool.mypy.overrides]]
module = [
    "modelroot",
    "modelroot.*",
    "pandas",
    "pandas.*",
    "numpy",
    "numpy.*",
    "sklearn",
    "sklearn.*",
    "scipy",
    "scipy.*",
]
ignore_missing_imports = true
ignore_errors = true

